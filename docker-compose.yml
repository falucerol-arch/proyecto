services:

  minio:
    image: minio/minio:latest

    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password123"

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data


  # Este contenedor espera a que MinIO responda
  # y después crea automáticamente el bucket
  minio-setup:

    image: minio/mc:latest

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      echo 'Esperando a MinIO...';

      until mc alias set myminio http://minio:9000 admin password123 >/dev/null 2>&1; do
        sleep 2;
      done;

      mc mb --ignore-existing myminio/usuarios-bucket;

      mc anonymous set none myminio/usuarios-bucket;

      echo 'Bucket usuarios-bucket listo.';

      exit 0;
      "


volumes:

  minio_data: